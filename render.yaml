services:
  - type: web
    name: telegram-video-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_BASE
        value: https://video-play-api.newstreamcp.workers.dev/api
    pythonVersion: 3.11.0
